[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Route all API calls to Netlify Functions if serverless adapter is used
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback redirect for client-side React router routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
